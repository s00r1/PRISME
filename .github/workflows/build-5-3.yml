name: PRISME 5.3 compile

on:
  push:
    branches: [main]
    paths:
      - 'AndroidManifest.xml'
      - 'src/fr/dm100/prisme/**'
      - '.github/workflows/build-5-3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile PRISME 5.3
        shell: pwsh
        run: ./build.ps1 -Unsigned -OutputFile PRISME-5.3.apk
      - name: Upload unsigned APK for local signing
        uses: actions/upload-artifact@v4
        with:
          name: PRISME-5.3-unsigned
          path: PRISME-5.3-unsigned.apk
          if-no-files-found: error
